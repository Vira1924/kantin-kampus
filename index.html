<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kantin Kampus</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Brand & Icon Header -->
            <div class="brand-header">
                <div class="brand-logo-circle">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <span class="campus-badge"><i class="fa-solid fa-graduation-cap"></i> Portal Mahasiswa</span>
                <h1>Kantin Kampus</h1>
                <p class="subtitle">Silakan login untuk memesan makanan & minuman favoritmu</p>
            </div>

            <!-- Pesan Notifikasi Alert (Dikelola via JS) -->
            <div id="loginAlert" class="alert-box" style="display: none;"></div>

            <!-- Form Login -->
            <form id="loginForm" class="auth-form" novalidate>
                
                <div class="form-group">
                    <label for="username">
                        <i class="fa-regular fa-user"></i> Username
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="Contoh: vira" 
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Masukkan password" 
                            autocomplete="current-password"
                            required>
                        <button type="button" id="togglePassword" class="btn-toggle-pwd" title="Lihat/Sembunyikan password" aria-label="Toggle password">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Ingat saya</span>
                    </label>
                    <a href="javascript:void(0)" class="forgot-link" id="btnHelp">Bantuan?</a>
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">
                    <span>Masuk ke Kantin</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="demo-card">
                <div class="demo-header">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Akun Demo Tugas P.WEB:</span>
                </div>
                <div class="demo-body">
                    <p>Username: <strong>vira</strong> | Password: <strong>12345</strong></p>
                    <button type="button" class="btn-quick-fill" id="btnQuickFill">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Klik untuk Isi Otomatis
                    </button>
                </div>
            </div>

            <!-- Footer Hak Cipta -->
            <footer class="login-footer">
                <p>&copy; 2026 Kantin Kampus Digital • Tugas Pemrograman Web</p>
            </footer>

        </div>
    </div>

    <!-- Script JS -->
    <script src="script.js"></script>

</body>
</html>
